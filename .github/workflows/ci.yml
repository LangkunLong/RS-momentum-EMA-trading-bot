name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-quality-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q -x '[/\\](\.git|\.worktrees|\.artifacts|\.venv)[/\\]' .

  offline-tests:
    name: Offline tests (informational, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run offline tests (informational)
        id: pytest
        run: python -m pytest -q --no-cov -m "not integration"

      - name: Report test outcome
        if: always()
        run: |
          echo "### Informational offline tests" >> "$GITHUB_STEP_SUMMARY"
          echo "Python: ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Outcome: ${{ steps.pytest.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "This test job is advisory. Failures remain visible and do not block the quality job." >> "$GITHUB_STEP_SUMMARY"
